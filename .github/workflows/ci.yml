name: CI

# Status check for every pull request: build the site, then run the whole
# release gate — the type-check and the four guards. The Pages deploy workflow
# (deploy.yml) runs the same gate against the dist it publishes, so a push
# straight to main is gated by the same checks a pull request is, and a failure
# stops the publish instead of shipping the regression.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: astro check + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The whole release gate, in one step: `check:all` is the type-check
      # (`astro check`) followed by the four guards, which fail what a build and
      # a type-check both pass, so nothing else in this workflow can see them.
      #
      # The type-check runs after the build only because the guards read the
      # built HTML and this is one script. `astro build` does not type-check, so
      # a type error that still builds is caught here and nowhere else.
      #
      #   copy      Astro drops the space at a line break beside an inline
      #             element, welding words together ("sentence:the knowledge").
      #   demo      The askable-library demo is wired by ids in markup and is
      #             sold as scripted and offline: a broken pair or a stray
      #             fetch builds and renders fine, and clicking does nothing.
      #   contrast  The palette's token pairs: a text color equal to its
      #             surface renders fine and invisible.
      #   language  Nobody in the copy is defaulted to a gender (Brand voice).
      #
      # Each check prints its own count, so a single step still names the one
      # that failed. `check:all` is the gate, so a fifth guard is one line in
      # package.json and both this workflow and deploy.yml pick it up.
      - name: Checks (type-check + guards)
        run: npm run check:all
