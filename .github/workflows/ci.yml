name: CI

# Status check for every pull request: type-check the Astro codebase,
# then build the site. The Pages deploy workflow (deploy.yml) ships main.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: astro check + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (astro check)
        run: npx astro check

      - name: Build
        run: npm run build

      # Astro drops the space at a line break beside an inline element, welding
      # words together ("sentence:the knowledge"). Read the built HTML for it.
      - name: Copy spacing guard
        run: npm run check:copy

      # The palette's contrast pairs, which no type-check or build can see: a
      # text color equal to its surface renders "fine" and invisible.
      - name: Contrast guard
        run: npm run check:contrast

      # Nobody in the copy is defaulted to a gender (README, Brand voice).
      - name: Language guard
        run: npm run check:language
